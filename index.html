<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Reporte de horas ASD Media</title>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow" id="range">Reporte de horas</div>
    <h1>Horas ASD Media</h1>
    <p class="muted">Lee las horas registradas en Super Productivity, incluidas las tareas archivadas.</p>
  </header>

  <div class="controls">
    <div class="row">
      <span class="month">
        <button class="iconbtn" id="prevM" title="Mes anterior" aria-label="Mes anterior">‹</button>
        <input type="month" id="month" aria-label="Mes" />
        <button class="iconbtn" id="nextM" title="Mes siguiente" aria-label="Mes siguiente">›</button>
      </span>
      <label>Redondeo
        <select id="round">
          <option value="0">Sin redondeo</option>
          <option value="15">15 min hacia arriba</option>
          <option value="30">30 min hacia arriba</option>
          <option value="60">1 h hacia arriba</option>
        </select>
      </label>
      <button id="refresh">Actualizar</button>
    </div>
    <div class="pchips" id="pchips"></div>
    <p class="muted" id="hint">El redondeo se aplica a cada tarea en cada día. Desmarca un proyecto para quitarlo del reporte y edita su nombre si quieres otro en el Markdown.</p>
    <p class="msg" id="err" hidden></p>
  </div>

  <div id="out" style="display:grid;gap:32px"></div>
</div>

<script type="module" src="/src/js/main.js"></script>
</body>
</html>
