<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Hours Report</title>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow" id="range" data-i18n="HEADER.EYEBROW"></div>
    <h1 data-i18n="HEADER.TITLE"></h1>
    <p class="muted" data-i18n="HEADER.SUBTITLE"></p>
  </header>

  <div class="controls">
    <div class="row">
      <span class="month">
        <button class="iconbtn" id="prevM" data-i18n-attr="title:CONTROLS.PREV_MONTH,aria-label:CONTROLS.PREV_MONTH">‹</button>
        <input type="month" id="month" data-i18n-attr="aria-label:CONTROLS.MONTH" />
        <button class="iconbtn" id="nextM" data-i18n-attr="title:CONTROLS.NEXT_MONTH,aria-label:CONTROLS.NEXT_MONTH">›</button>
      </span>
      <label><span data-i18n="CONTROLS.ROUNDING"></span>
        <select id="round">
          <option value="0" data-i18n="CONTROLS.ROUND_NONE"></option>
          <option value="15" data-i18n="CONTROLS.ROUND_15"></option>
          <option value="30" data-i18n="CONTROLS.ROUND_30"></option>
          <option value="60" data-i18n="CONTROLS.ROUND_60"></option>
        </select>
      </label>
      <button id="refresh" data-i18n="CONTROLS.REFRESH"></button>
    </div>
    <div class="pchips" id="pchips"></div>
    <p class="muted" id="hint" data-i18n="CONTROLS.HINT"></p>
    <p class="msg" id="err" hidden></p>
  </div>

  <div id="out" style="display:grid;gap:32px"></div>
</div>

<script type="module" src="/src/js/main.js"></script>
</body>
</html>
